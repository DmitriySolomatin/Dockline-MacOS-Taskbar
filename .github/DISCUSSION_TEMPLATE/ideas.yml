body:
  - type: markdown
    attributes:
      value: |
        Search existing ideas first; you can upvote one you like.
  - type: textarea
    id: need
    attributes:
      label: What would you like to improve?
      description: Describe the task or difficulty.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your idea
      description: What would make it easier?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples (optional)
      description: Add a sketch or example without private information.
